# ── Test/CI overlay: random-weight tiny models, no network, CPU-friendly sizes.
#    Merge on top of base.yaml: --config configs/base.yaml configs/tiny.yaml

target:
  source: random
  attn_implementation: eager      # eager always honors custom 4D tree masks

drafter:
  hidden_size: 128
  num_heads: 4
  num_kv_heads: 2
  intermediate_size: 256

tree:
  num_nodes: 12

profiling:
  token_counts: [1, 2, 4]
  prefix_len: 32
  warmup_iters: 1
  timed_iters: 2

data:
  dataset_name: _random
  max_samples: 8
  max_seq_len: 64
  shard_tokens: 512
  storage_dtype: float32

train:
  batch_size: 2
  grad_accum: 1
  warmup_steps: 2
  log_every: 1
  save_every: 2

eval:
  K_sweep: [2, 4]
  max_new_tokens: 16
  num_prompts: 2

paths:
  root: ./runs                    # tests override again to a pytest tmp dir
