K: 8
paths:
  root: /workspace/specdec-runs
  features: ${paths.root}/features
  checkpoints: ${paths.root}/checkpoints
  results: ${paths.root}/results
runtime:
  device: auto
  dtype: auto
  seed: 0
target:
  source: hub
  model_id: NousResearch/Meta-Llama-3-8B-Instruct
  revision: null
  attn_implementation: sdpa
  random_config:
    num_hidden_layers: 2
    hidden_size: 128
    num_attention_heads: 4
    num_key_value_heads: 2
    intermediate_size: 256
    vocab_size: 256
    max_position_embeddings: 512
drafter:
  num_layers: 1
  hidden_size: 4096
  num_heads: 32
  num_kv_heads: 8
  intermediate_size: 14336
  rope_theta: 500000.0
  apply_final_norm: true
  fc_bias: false
  layer0_no_input_norm: false
tree:
  num_nodes: 256
  max_depth: ${K}
  allocation: geometric
  geometric:
    decay: 0.5
sampling:
  temperature: 1.0
  top_p: 1.0
decode:
  commit_fold: true
  dynamic_tree: false
  kv_gather: true
  profile_timing: false
profiling:
  token_counts:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 128
  prefix_len: 1024
  warmup_iters: 3
  timed_iters: 20
  out_dir: ${paths.results}/profiling
data:
  dataset_name: Aeala/ShareGPT_Vicuna_unfiltered
  dataset_config: null
  split: train
  text_field: conversations
  max_samples: null
  max_seq_len: 2048
  layer_index: -2
  feature_tap: index
  storage_dtype: float16
  shard_tokens: 500000
  out_dir: ${paths.features}/llama3-8b
  resume: true
  dry_run: false
  estimate_samples: 200
train:
  rollout_K: ${K}
  rollout_detach: false
  target_dtype: float32
  allow_tf32: false
  ce_chunk: 256
  rollout_step_decay: 1.0
  lr: 3.0e-05
  weight_decay: 0.01
  warmup_steps: 500
  batch_size: 4
  grad_accum: 4
  max_steps: 40000
  max_grad_norm: 1.0
  loss:
    w_feat: 1.0
    w_logit: 0.1
  log_every: 50
  save_every: 2000
  resume: true
  ckpt_dir: ${paths.checkpoints}/drafter
eval:
  K_sweep:
  - 4
  - 8
  max_new_tokens: 128
  num_prompts: 50
  greedy: true
  drafter_ckpt: /workspace/specdec-runs/checkpoints/e5-tf-s0/step_10000.pt
  prompt_source: mtbench
  prompt_split: test
  prompt_dev_size: 200
  heldout_offset: 100000
  out_dir: /workspace/specdec-runs/results/e5/e5-tf-s0-mtbench
  experiment_id: e5-e5-tf-s0-mtbench
